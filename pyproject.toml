[project]
name = "federated-retriever-learning"
version = "0.1.0"
description = "Federated retriever learning with Tevatron and Flower"
requires-python = ">=3.11, <3.12"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.40.0",
    "flwr-datasets==0.6.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "evaluate==0.4.6",
    "datasets==4.8.5",
    "faiss-gpu==1.15.1",
    "tevatron",
    "wandb",
    "deepspeed>=0.19.8",
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    "beir>=2.2.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version == '3.11'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
tevatron = { git = "https://github.com/vlcfaria/tevatron", branch = "main" }

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.40.0"

[tool.flwr.app.components]
serverapp = "federated_retriever.server:server_app"
clientapp = "federated_retriever.client:app"

[tool.flwr.app.config]
fraction-train = 1.0
fraction-evaluate = 0.0
num-server-rounds = 1
save-model = true
subsets = "arguana,fever,fiqa,hotpotqa,msmarco-passage,nq,scidocsrr"
model_name_or_path="intfloat/e5-small-unsupervised"
attn_implementation = "sdpa"
bf16 = true
pooling = "mean"
normalize = true
query_prefix = "query: "
passage_prefix = "passage: "
dataset_name = "../dataset/rlhn-680k/dev-split/train"
query_max_len = 350
passage_max_len = 350
train_group_size = 8
per_device_train_batch_size = 256
gradient_accumulation_steps = 1
learning_rate = 2e-5
temperature = 0.01
logging_steps = 20
save_strategy = "steps"
save_total_limit = 5
report_to = "wandb"
seed = 42
weight_decay = 0.01 # TODO adjust potentially, but maybe not
warmup_steps = 0.1
gradient_checkpointing = true
dataloader_num_workers = 8 
max_steps = 10000 #TODO adjust
save_steps = 2000 # TODO adjust
validate_mode = "sync"
eval_query_dir = "../dataset/rlhn-680k/dev-split/dev/"
eval_corpus_dir = "../dataset/rlhn-680k/dev-corpus-final"
validate_query_max_len = 512
validate_passage_max_len = 512
