[project]
name = "federated-retriever-learning"
version = "0.1.0"
description = "Federated retriever learning with Tevatron and Flower"
requires-python = ">=3.11, <3.12"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.40.0",
    "flwr-datasets==0.6.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "evaluate==0.4.6",
    "datasets==4.8.5",
    "faiss-gpu==1.15.1",
    "tevatron",
    "wandb",
    "deepspeed>=0.19.8",
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    "beir>=2.2.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version == '3.11'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
tevatron = { git = "https://github.com/vlcfaria/tevatron", branch = "main" }

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.40.0"

[tool.flwr.app.components]
serverapp = "federated_retriever.server:server_app"
clientapp = "federated_retriever.client:app"

[tool.flwr.app.config]
project-name="federated-retriever-learning"
run-name="testing"
fraction-train = 1.0 # Leave for cross-silo
fraction-evaluate = 0.25 # BEIR avg
num-server-rounds = 30
eval-interval = 1
save-model = true
subsets = "arguana,fever,fiqa,hotpotqa,msmarco_passage,nq,scidocsrr"
model_name_or_path="intfloat/e5-small-unsupervised"
attn_implementation = "sdpa"
bf16 = true
pooling = "mean"
normalize = true
query_prefix = "query: "
passage_prefix = "passage: "
dataset_name = "bigni/rlhn-680k-dev"
query_max_len = 192
passage_max_len = 192
train_group_size = 8
per_device_train_batch_size = 64 #Lower due to federated setup
gradient_accumulation_steps = 1
learning_rate = 2e-5 #E5-base standard
temperature = 0.01
logging_steps = 20
# report_to = "wandb"
seed = 42
weight_decay = 0.01 #E5 standard
warmup_steps = 0.1 #Warmup fresh adamw values
gradient_checkpointing = true
dataloader_num_workers = 8 
deepspeed = "config/ds_zero0_federated_config.json"
max_steps = 5 # NOTE: this is the steps taking on each client training round
eval_query_dir = "../dataset/rlhn-680k/dev-split/dev/"
eval_corpus_dir = "../dataset/rlhn-680k/dev-corpus-final"
validate_query_max_len = 512
validate_passage_max_len = 512
